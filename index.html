<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Звёздная карта</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

    <div id="map-container">
        <svg id="starmap"></svg>
    </div>

    <div id="tooltip">
        <h3 id="tt-title">Название</h3>
        <p id="tt-info">Информация</p>
    </div>

    <div id="controls-panel">
        <button id="btn-toggle-route">Построить маршрут</button>
    </div>

    <div id="route-panel">
        <h4>Расчет маршрута</h4>
        <div class="route-stats">
            <p>Пути '0': <span id="route-dist-0">0</span></p>
            <p>Цветные пути: <span id="route-dist-color">0</span></p>
            <p>Вне путей: <span id="route-dist-off">0</span></p>
            <p>Количество точек: <span id="route-points">0</span></p>
        </div>
        <button id="btn-reset-route">Сброс</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
