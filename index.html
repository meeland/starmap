<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Звездная Карта</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-layer">
        <div class="hud-panel top-left legend">
            <div class="legend-item"><span class="color-box rep"></span> Галактическая Республика</div>
            <div class="legend-item"><span class="color-box cis"></span> Конфедерация (КНС)</div>
            <div class="legend-item"><span class="color-box neu"></span> Нейтральные Системы</div>
        </div>

        <div class="hud-panel top-right">
            <div class="search-box">
                <input type="text" id="planet-search" placeholder="Поиск системы..." autocomplete="off">
                <div id="search-results"></div>
            </div>
        </div>

        <div class="hud-panel bottom-right">
            <div class="controls">
                <button id="btn-zoom-in">+</button>
                <button id="btn-zoom-out">-</button>
                <button id="btn-reset">⌂</button>
            </div>
            <div class="telemetry">
                <div>СЕКТОР: <span id="coord-x">000</span> : <span id="coord-y">000</span></div>
                <div>МАСШТАБ: <span id="zoom-level">1.00</span>x</div>
            </div>
        </div>
    </div>

    <div id="map-container">
        <svg id="starmap">
            <defs>
                <pattern id="grid-pattern" width="100" height="100" patternUnits="userSpaceOnUse">
                    <g fill="#2a2c30">
                        <rect x="0" y="0" width="5" height="1" />   <rect x="96" y="0" width="4" height="1" />  <rect x="0" y="0" width="1" height="5" />   <rect x="0" y="96" width="1" height="4" />  <rect x="20" y="0" width="1" height="1" />
                        <rect x="40" y="0" width="1" height="1" />
                        <rect x="60" y="0" width="1" height="1" />
                        <rect x="80" y="0" width="1" height="1" />
                        <rect x="0" y="20" width="1" height="1" />
                        <rect x="0" y="40" width="1" height="1" />
                        <rect x="0" y="60" width="1" height="1" />
                        <rect x="0" y="80" width="1" height="1" />
                        <rect x="20" y="20" width="1" height="1" /><rect x="40" y="20" width="1" height="1" /><rect x="60" y="20" width="1" height="1" /><rect x="80" y="20" width="1" height="1" />
                        <rect x="20" y="40" width="1" height="1" /><rect x="40" y="40" width="1" height="1" /><rect x="60" y="40" width="1" height="1" /><rect x="80" y="40" width="1" height="1" />
                        <rect x="20" y="60" width="1" height="1" /><rect x="40" y="60" width="1" height="1" /><rect x="60" y="60" width="1" height="1" /><rect x="80" y="60" width="1" height="1" />
                        <rect x="20" y="80" width="1" height="1" /><rect x="40" y="80" width="1" height="1" /><rect x="60" y="80" width="1" height="1" /><rect x="80" y="80" width="1" height="1" />
                    </g>
                </pattern>
            </defs>

            <g id="map-group">
                <rect x="0" y="0" width="4000" height="4000" fill="url(#grid-pattern)"></rect>
                <text x="20" y="60" font-family="Orbitron" font-size="38" fill="rgba(150, 150, 150, 0.15)" font-weight="bold" letter-spacing="8">FALLEN REPUBLIC</text>
                <g id="connections-layer"></g>
                <g id="planets-layer"></g>
            </g>
        </svg>
    </div>

    <div id="tooltip">
        <div id="tt-title">Название</div>
        <div id="tt-faction-badge">Фракция</div>
        <hr class="tt-divider">
        <div id="tt-info">Информация</div>
    </div>
    
    <div id="hover-tooltip">Название</div>

    <script src="faction.js"></script>
    <script src="script.js"></script>
</body>
</html>
