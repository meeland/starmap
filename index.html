<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта планет</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19; /* Тёмный космический фон */
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }

        #map-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .planet {
            fill: #e0e0e0;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            transition: fill 0.2s;
        }

        .planet:hover {
            fill: #4db8ff;
        }

        .connection {
            stroke: #334466;
            stroke-width: 2;
            opacity: 0.6;
        }

        /* Стили всплывающего окна */
        #tooltip {
            position: absolute;
            background: rgba(15, 25, 40, 0.95);
            border: 1px solid #4db8ff;
            padding: 15px;
            border-radius: 8px;
            pointer-events: none; /* Чтобы окно не перехватывало клики */
            display: none;
            max-width: 250px;
            box-shadow: 0 0 15px rgba(77, 184, 255, 0.2);
            z-index: 10;
        }

        #tooltip h3 {
            margin: 0 0 10px 0;
            color: #4db8ff;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <svg id="starmap"></svg>
    </div>

    <div id="tooltip">
        <h3 id="tt-title">Название</h3>
        <p id="tt-info">Информация</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
