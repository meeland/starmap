<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR MAP</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-layer">
        <div class="hud-panel top-left legend" id="legend-panel">
            <div id="legend-header">
                <span>ЛЕГЕНДА</span>
                <span id="legend-arrow">▼</span>
            </div>
            <div id="faction-legend"></div>
        </div>

        <div class="hud-panel top-right search-layers-panel" style="display: flex; gap: 15px; align-items: center; padding: 10px 15px;">
            <div class="layer-controls">
                <button id="btn-layer-bare" class="layer-btn active" title="Базовый слой">◯</button>
                <button id="btn-layer-pol" class="layer-btn" title="Политический слой">♔</button>
                <button id="btn-layer-reg" class="layer-btn" title="Регионы">⬡</button>
            </div>
            
            <div class="search-box">
                <button id="btn-search-toggle" title="Поиск систем">🔍</button>
                <div id="search-wrap">
                    <input type="text" id="planet-search" placeholder="Поиск системы..." autocomplete="off">
                    <div id="search-results"></div>
                </div>
            </div>
        </div>

        <button id="btn-toggle-route">ПОСТРОИТЬ МАРШРУТ</button>

        <div id="route-panel">
            <div class="route-panel-content">
                <div class="route-header">МАРШРУТИЗАТОР</div>
                <div class="route-stat">Региональные пути: <span id="route-dist-0">0</span></div>
                <div class="route-stat">Магистральные пути: <span id="route-dist-color">0</span></div>
                <div class="route-stat">Вне путей: <span id="route-dist-off">0</span></div>
                <div class="route-stat">Точек маршрута: <span id="route-points">0</span></div>
                <button id="btn-reset-route">СБРОС</button>
            </div>
        </div>

        <div class="hud-panel bottom-right zoom-panel">
            <div class="telemetry">
                <div>МАСШТАБ: <span id="zoom-level">1.00</span>x</div>
            </div>
        </div>
    </div>

    <div id="map-container">
        <svg id="starmap">
            <defs>
                <pattern id="grid-pattern" width="100" height="100" patternUnits="userSpaceOnUse">
                    <g fill="#2a2c30">
                        <rect x="0" y="0" width="5" height="1" />   <rect x="96" y="0" width="4" height="1" />  <rect x="0" y="0" width="1" height="5" />   <rect x="0" y="96" width="1" height="4" />  <rect x="20" y="0" width="1" height="1" />
                        <rect x="40" y="0" width="1" height="1" />
                        <rect x="60" y="0" width="1" height="1" />
                        <rect x="80" y="0" width="1" height="1" />
                        <rect x="0" y="20" width="1" height="1" />
                        <rect x="0" y="40" width="1" height="1" />
                        <rect x="0" y="60" width="1" height="1" />
                        <rect x="0" y="80" width="1" height="1" />
                        <rect x="20" y="20" width="1" height="1" /><rect x="40" y="20" width="1" height="1" /><rect x="60" y="20" width="1" height="1" /><rect x="80" y="20" width="1" height="1" />
                        <rect x="20" y="40" width="1" height="1" /><rect x="40" y="40" width="1" height="1" /><rect x="60" y="40" width="1" height="1" /><rect x="80" y="40" width="1" height="1" />
                        <rect x="20" y="60" width="1" height="1" /><rect x="40" y="60" width="1" height="1" /><rect x="60" y="60" width="1" height="1" /><rect x="80" y="60" width="1" height="1" />
                        <rect x="20" y="80" width="1" height="1" /><rect x="40" y="80" width="1" height="1" /><rect x="60" y="80" width="1" height="1" /><rect x="80" y="80" width="1" height="1" />
                    </g>
                </pattern>
            </defs>

            <g id="map-group">
                <rect x="0" y="0" width="4000" height="4000" fill="url(#grid-pattern)"></rect>
                <text x="20" y="60" font-size="38" fill="rgba(150, 150, 150, 0.15)" font-weight="bold" letter-spacing="8">FALLEN REPUBLIC</text>
                
                <g id="voronoi-layer" style="display: none;"></g>
                <g id="voronoi-region-layer" style="display: none;"></g>
                <g id="connections-layer"></g>
                <g id="route-visual-layer"></g>
                <g id="planets-layer"></g>
                <g id="objects-layer"></g>
            </g>
        </svg>
    </div>

    <div id="tooltip">
        <div class="tt-main-content">
            <div id="tt-title">Название</div>
            <div id="tt-faction-badge">Фракция</div>
            <div id="tt-info">Информация</div>
        </div>
        <a id="tt-wiki" href="#" target="_blank">WOOKIEEPEDIA</a>
    </div>

    <div id="hover-coords">X: 00 | Y: 00</div>

    <script src="faction.js"></script>
    <script src="script.js"></script>
</body>
</html>
