<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Звёздная карта</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <script src="config.js"></script>
</head>
<body>

<div id="map-container" class="political-mode">
    <svg id="starmap">
        <g id="map-group">
            <g id="voronoi-layer"></g>
            <g id="connections-layer"></g>
            <g id="route-visual-layer"></g>
            <g id="planets-layer"></g>
            <g id="objects-layer"></g>
        </g>
    </svg>
</div>

<div id="ui-layer">
    
    <div id="search-container">
        <button id="btn-search-toggle" class="layer-btn" title="Поиск">🔍</button>
        
        <div id="search-input-wrapper">
            <input type="text" id="planet-search" placeholder="Поиск систем...">
            <div id="search-results" style="display: none;"></div>
        </div>
    </div>

    <div class="layer-controls">
        <button id="btn-layer-bare" class="layer-btn" title="Базовый слой">Б</button>
        <button id="btn-layer-pol" class="layer-btn active" title="Политическая карта">П</button>
    </div>

    <div class="zoom-controls">
        <button id="btn-zoom-in" class="zoom-btn">+</button>
        <button id="btn-zoom-out" class="zoom-btn">−</button>
        <button id="btn-reset" class="zoom-btn">⌂</button>
    </div>

    <div id="zoom-level">1.00</div>

    <div id="route-panel">
        <div class="route-header">
            <h3>Проложить маршрут</h3>
            <button id="btn-toggle-route" class="layer-btn" title="Режим маршрута">М</button>
        </div>
        <div class="route-stats">
            <div>Региональные пути: <span id="route-dist-0">0.0</span></div>
            <div>Магистральные пути: <span id="route-dist-color">0.0</span></div>
            <div>Вне путей: <span id="route-dist-off">0.0</span></div>
            <div>Точек в маршруте: <span id="route-points">0</span></div>
        </div>
        <button id="btn-reset-route">Сбросить маршрут</button>
    </div>

    <div id="legend-panel">
        <div id="legend-header">
            <h3>Легенда</h3>
            <span id="legend-arrow">▼</span>
        </div>
        <div id="faction-legend"></div>
    </div>
</div>

<div id="tooltip" style="display: none;">
    <div id="tt-header">
        <h3 id="tt-title"></h3>
        <span id="tt-faction-badge"></span>
    </div>
    <div id="tt-info"></div>
    <a id="tt-wiki" href="#" target="_blank">Wookieepedia</a>
</div>

<div id="hover-coords" style="display: none;"></div>

<script src="script.js"></script>

</body>
</html>
